<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tell us about your team</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1a1f36; --text:#353a44; --muted:#687385; --line:#e3e8ee; --cream:#f6f8fa;
    --accent:#262626; --red:#c4352b;
    --font:"Figtree",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  }
  *,*::before,*::after{box-sizing:border-box}
  body{
    margin:0;min-height:100vh;display:grid;place-items:center;padding:72px 24px 24px;background:#fff;color:var(--ink);
    font-family:var(--font);font-size:14px;line-height:1.4;-webkit-font-smoothing:antialiased;
  }
  h1,p{margin:0}
  button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}

  .top{position:fixed;left:0;top:0;padding:20px 28px}
  .brand{display:flex;align-items:center;gap:10px;font-size:18px;font-weight:600}
  .brand img{width:30px;height:30px;display:block}

  .card{
    width:100%;max-width:440px;padding:44px 40px 36px;background:var(--cream);border-radius:32px;
    box-shadow:0 12px 32px rgba(26,31,54,.10),0 2px 6px rgba(26,31,54,.06);
  }
  h1{font-size:26px;line-height:1.2;font-weight:700;letter-spacing:-.01em}
  .lead{margin-top:6px;color:var(--muted)}

  form{margin-top:26px;display:grid;gap:16px}
  .f{display:grid;gap:6px}
  .f label,.f .lbl{font-size:13px;font-weight:500;color:var(--text)}
  .hint{font-size:12.5px;color:var(--muted);margin-top:-2px}
  .in{position:relative}
  .in select{
    width:100%;height:44px;padding:0 40px 0 14px;border:1px solid var(--line);border-radius:12px;background:#fff;
    font:inherit;font-size:15px;color:var(--ink);appearance:none;-webkit-appearance:none;cursor:pointer;
  }
  .in select:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
  .in select:invalid{color:#9aa3b2}
  .in select option{color:var(--ink)}
  .in [aria-invalid="true"]{border-color:var(--red)}
  .in svg{position:absolute;right:14px;top:50%;transform:translateY(-50%);width:16px;height:16px;fill:none;stroke:var(--muted);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;pointer-events:none}
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip{height:36px;padding:0 14px;border:1px solid var(--line);border-radius:999px;background:#fff;font-size:13.5px;font-weight:500;color:var(--text);transition:background .15s,border-color .15s}
  .chip:hover{border-color:#b5bcc9}
  .chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
  .err{font-size:12.5px;color:var(--red)}

  .go{
    display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:46px;margin-top:14px;
    border-radius:999px;background:var(--accent);font-size:15px;font-weight:600;color:#fff;transition:background .2s;
  }
  .go:hover{background:#404040}
  .go[disabled]{background:#404040;cursor:default}
  .skip{display:block;margin:16px auto 0;font-size:12.5px;font-weight:500;color:var(--muted);text-decoration:none;text-align:center}
  .skip:hover{color:var(--ink)}
  @media (max-width:480px){.card{padding:32px 22px 28px;border-radius:24px}}
</style>
</head>

  <h1>Tell us about your team</h1>
  <p class="lead">This helps us tailor your experience and give you more relevant tips.</p>

  <form id="f" novalidate>

      <label for="role">What is your role?</label>

</main>
<script>
/* Team step for the mock-up. Answers are kept only for this browser tab and carry into onboarding. */
(function(){
  const $=id=>document.getElementById(id), role=$("role"), go=$("go"), chips=[...document.querySelectorAll(".chip")];
  chips.forEach(c=>c.addEventListener("click",()=>{c.setAttribute("aria-pressed",String(c.getAttribute("aria-pressed")!=="true"));$("teams-e").textContent=""}));
  role.addEventListener("input",()=>{$("role-e").textContent="";role.removeAttribute("aria-invalid")});
  $("f").addEventListener("submit",e=>{
    e.preventDefault();
    const picked=chips.filter(c=>c.getAttribute("aria-pressed")==="true").map(c=>c.textContent);
    $("role-e").textContent=role.value?"":"Choose your role";
    if(!role.value)role.setAttribute("aria-invalid","true");
    $("teams-e").textContent=picked.length?"":"Select at least one team";
    if(!role.value){role.focus();return}
    if(!picked.length)return;
    try{sessionStorage.setItem("cygnos-team",JSON.stringify({role:role.value,teams:picked}))}catch(_){}
    go.disabled=true;go.textContent="Continuing…";
    setTimeout(()=>{location.href="tools.html"},400);
  });
})();
</script>
</body>
</html>
