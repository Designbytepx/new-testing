<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>What describes your company</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1a1f36; --text:#353a44; --muted:#687385; --line:#e3e8ee; --cream:#f6f8fa;
    --accent:#262626; --red:#c4352b;
    --font:"Figtree",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  }
  *,*::before,*::after{box-sizing:border-box}
  body{
    margin:0;min-height:100vh;display:grid;place-items:center;padding:72px 24px 24px;background:#fff;color:var(--ink);
    font-family:var(--font);font-size:14px;line-height:1.4;-webkit-font-smoothing:antialiased;
  }
  h1,p{margin:0}
  button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}

  .top{position:fixed;left:0;top:0;padding:20px 28px}
  .brand{display:flex;align-items:center;gap:10px;font-size:18px;font-weight:600}
  .brand img{width:30px;height:30px;display:block}

  .card{
    width:100%;max-width:640px;padding:44px 40px 32px;background:var(--cream);border-radius:32px;
    box-shadow:0 12px 32px rgba(26,31,54,.10),0 2px 6px rgba(26,31,54,.06);
  }
  h1{font-size:26px;line-height:1.2;font-weight:700;letter-spacing:-.01em}
  .lead{margin-top:6px;color:var(--muted)}

  .grid{margin-top:26px;display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
  .opt{display:flex;flex-direction:column;align-items:flex-start;gap:14px;min-height:96px;padding:14px;border:1px solid var(--line);border-radius:14px;background:#fff;text-align:left;font-size:13.5px;font-weight:500;color:var(--text);transition:border-color .15s,box-shadow .15s}
  .opt svg{width:20px;height:20px;fill:none;stroke:var(--muted);stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
  .opt:hover{border-color:#b5bcc9}
  .opt[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
  .opt[aria-pressed="true"] svg{stroke:var(--accent)}
  .err:empty{display:none}
  .err{margin-top:12px;font-size:12.5px;color:var(--red)}

  .foot{display:flex;align-items:center;justify-content:space-between;margin-top:26px}
  .foot a,.foot button{font-size:13px;font-weight:500;color:var(--muted);text-decoration:none}
  .foot a:hover,.foot button:hover{color:var(--ink)}
  .foot .go{display:flex;align-items:center;justify-content:center;height:38px;padding:0 20px;border-radius:999px;background:var(--accent);font-size:14px;font-weight:600;color:#fff;transition:background .2s}
  .foot .go:hover{background:#404040;color:#fff}
  .foot .go[disabled]{background:#404040;cursor:default}
  .right{display:flex;align-items:center;gap:18px}
  @media (max-width:640px){.grid{grid-template-columns:repeat(2,1fr)}.card{padding:32px 22px 24px;border-radius:24px}}
</style>
</head>

<script>
/* Company type step for the mock-up. The answer is kept only for this browser tab. */
(function(){
  const $=id=>document.getElementById(id), cards=[...document.querySelectorAll(".opt")], go=$("go");
  let pick="";
  cards.forEach(c=>c.addEventListener("click",()=>{
    cards.forEach(x=>x.setAttribute("aria-pressed",String(x===c)));
    pick=c.textContent.trim();$("e").textContent="";
  }));
  go.addEventListener("click",()=>{
    if(!pick){$("e").textContent="Choose what best describes your company";return}
    try{sessionStorage.setItem("cygnos-type",pick)}catch(_){}
    go.disabled=true;go.textContent="Continuing…";
    setTimeout(()=>{location.href="company.html"},400);
  });
})();
</script>
